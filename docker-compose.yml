version: '3.8'

services:
  app:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: book_loan_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:-base64:VaC5z2GTwGSp22FNqSwKTSL7vS5hJjLZlS0Btoiqo9Q=}
      - APP_URL=http://localhost:8000
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=book_loan
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./BE:/var/www/html
      - /var/www/html/vendor

  queue:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: book_loan_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=2 --timeout=120
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:-base64:VaC5z2GTwGSp22FNqSwKTSL7vS5hJjLZlS0Btoiqo9Q=}
      - APP_URL=http://localhost:8000
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=book_loan
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./BE:/var/www/html
      - /var/www/html/vendor

  db:
    image: mysql:8.0
    container_name: book_loan_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: book_loan
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - dbdata:/var/lib/mysql

  frontend:
    build:
      context: ./FE/book_loan
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    container_name: book_loan_fe
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - app

volumes:
  dbdata:
